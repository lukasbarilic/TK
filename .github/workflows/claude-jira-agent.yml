# .github/workflows/claude-jira-agent.yml
#
# AI agent spúšťaný z Jiry.
#
#   Jira Automation (štítok "ai-agent" na tikete)
#     -> GitHub repository_dispatch (event "jira-ai-ticket", payload { key })
#     -> tento workflow načíta tiket z Jira API, Claude ho implementuje,
#        workflow commitne, otvorí PR "<KĽÚČ>: <názov>" a výsledok zapíše do Jiry.
#
# Vďaka kľúču tiketu v názve vetvy, commitu a PR prepojí aplikácia
# "GitHub for Jira" vetvu, commity aj PR s tiketom automaticky.
#
# Tajomstvá (Settings -> Secrets and variables -> Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  token z predplatného Claude (už existuje)
#   AGENT_GH_TOKEN           fine-grained PAT len na tento repozitár:
#                            Contents RW, Pull requests RW, Workflows RW
#                            (PR vytvorený cez GITHUB_TOKEN by nespustil CI)
#   JIRA_EMAIL               e-mail technického/vášho Jira účtu
#   JIRA_API_TOKEN           API token z id.atlassian.com
# Premenná (Variables):
#   JIRA_BASE_URL            napr. https://vasafirma.atlassian.net

name: AI agent z Jiry (Claude)

on:
  repository_dispatch:
    types: [jira-ai-ticket]

concurrency:
  group: jira-agent-${{ github.event.client_payload.key }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      actions: read

    env:
      KEY: ${{ github.event.client_payload.key }}
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # Kľúč z externého systému: povoliť len tvar PROJ-123 (ochrana proti podvrhnutiu príkazov)
      - name: Kontrola kľúča tiketu
        run: |
          if [[ ! "$KEY" =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]]; then
            echo "Neplatný kľúč tiketu: '$KEY'"; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.AGENT_GH_TOKEN }}
          fetch-depth: 0

      - name: Načítanie tiketu z Jiry
        id: ticket
        run: |
          set -euo pipefail
          curl -sSf -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H "Accept: application/json" \
            "$JIRA_BASE_URL/rest/api/2/issue/$KEY?fields=summary,description,issuelinks,labels" > "$RUNNER_TEMP/issue.json"
          SUMMARY=$(jq -r '.fields.summary' "$RUNNER_TEMP/issue.json")
          SLUG=$(echo "$SUMMARY" | iconv -f utf-8 -t ascii//TRANSLIT | tr '[:upper:]' '[:lower:]' \
                 | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40 | sed -E 's/-+$//')
          BRANCH="ai/$KEY-$SLUG"
          mkdir -p .ai
          echo ".ai/" >> .git/info/exclude
          {
            echo "# $KEY: $SUMMARY"
            echo
            jq -r '.fields.description // "(bez popisu)"' "$RUNNER_TEMP/issue.json"
            echo
            echo "## Väzby"
            jq -r '.fields.issuelinks[]? | "- \(.type.name): \((.outwardIssue // .inwardIssue).key) \((.outwardIssue // .inwardIssue).fields.summary)"' "$RUNNER_TEMP/issue.json"
          } > .ai/task.md
          {
            echo "summary<<EOF"; echo "$SUMMARY"; echo "EOF"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Komentár do Jiry – začiatok
        run: |
          jq -n --arg b "🤖 AI agent začal pracovať na tikete. Priebeh: $RUN_URL" '{body:$b}' \
          | curl -sSf -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H "Content-Type: application/json" \
              -X POST "$JIRA_BASE_URL/rest/api/2/issue/$KEY/comment" -d @- > /dev/null

      - name: Vetva
        env:
          BRANCH: ${{ steps.ticket.outputs.branch }}
        run: |
          git config user.name  "Claude AI agent"
          git config user.email "ai-agent@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git checkout "$BRANCH"        # opakované spustenie pokračuje v existujúcej vetve
          else
            git checkout -b "$BRANCH"
          fi

      # --- Prostredie backendu ------------------------------------------------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-

      # --- Agent ---------------------------------------------------------------
      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Implementuj Jira tiket ${{ env.KEY }}. Zadanie (popis, akceptačné kritériá, mimo rozsahu, závislosti)
            je v súbore .ai/task.md. Riaď sa CLAUDE.md a návrhom docs/HLD-ubytovanie.md.
          claude_args: >-
            --max-turns 80
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(cd *),Bash(ls *),Bash(mkdir *),Bash(cp *),Bash(git status),Bash(git diff *),Bash(git log *),Bash(./mvnw *),Bash(mvn *),Bash(java -version),Bash(docker ps *),Bash(npm *),Bash(npx *)"
            --append-system-prompt "Pracuješ ako AI vývojár. Postup: 1) Prečítaj .ai/task.md, CLAUDE.md a relevantné kapitoly docs/HLD-ubytovanie.md. 2) Ak zadanie nemá jasný cieľ alebo akceptačné kritériá, NIČ neimplementuj, napíš konkrétne otázky do .ai/summary.md a skonči. 3) Inak implementuj čo najmenšiu zmenu, ktorá splní všetky akceptačné kritériá, vrátane testov. 4) Spusti ./mvnw -B verify v backend/; ak padá, oprav to. 5) NEcommituj ani nepushuj, to spraví workflow. 6) Na záver zapíš do .ai/summary.md po slovensky: čo si zmenil, ako si to overil, ktoré akceptačné kritériá sú splnené a čo má človek pri review skontrolovať. Nikdy nemeň .github/workflows, tajomstvá ani produkčnú konfiguráciu. Demo a testovacie dáta len fiktívne."

      # --- Commit, PR a výsledok do Jiry ----------------------------------------
      - name: Commit a pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
          SUMMARY: ${{ steps.ticket.outputs.summary }}
          BRANCH: ${{ steps.ticket.outputs.branch }}
        run: |
          set -euo pipefail
          touch .ai/summary.md
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "$KEY: $SUMMARY" -m "Jira: $JIRA_BASE_URL/browse/$KEY"
          # claude-code-action prepisuje origin vlastným tokenom -> pushujeme cez AGENT_GH_TOKEN
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          echo "Oprávnenia tokenu: $(gh api "repos/$GITHUB_REPOSITORY" --jq .permissions)"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr list --head "$BRANCH" --json url -q '.[0].url')
          if [ -z "$PR_URL" ]; then
            { echo "Jira: [$KEY]($JIRA_BASE_URL/browse/$KEY)"; echo; cat .ai/summary.md; } > "$RUNNER_TEMP/pr.md"
            PR_URL=$(gh pr create --title "$KEY: $SUMMARY" --body-file "$RUNNER_TEMP/pr.md" --head "$BRANCH")
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Komentár do Jiry – výsledok
        env:
          CHANGED: ${{ steps.pr.outputs.changed }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            HEAD="🤖 AI agent dokončil prácu. Pull request na review: $PR_URL"
          else
            HEAD="🤖 AI agent nespravil žiadne zmeny – pravdepodobne potrebuje doplniť zadanie:"
          fi
          jq -n --arg h "$HEAD" --rawfile s .ai/summary.md '{body: ($h + "\n\n" + $s)}' \
          | curl -sSf -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H "Content-Type: application/json" \
              -X POST "$JIRA_BASE_URL/rest/api/2/issue/$KEY/comment" -d @- > /dev/null

      - name: Komentár do Jiry – chyba
        if: failure()
        run: |
          jq -n --arg b "⚠️ AI agent skončil chybou. Detail: $RUN_URL" '{body:$b}' \
          | curl -sS -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H "Content-Type: application/json" \
              -X POST "$JIRA_BASE_URL/rest/api/2/issue/$KEY/comment" -d @- > /dev/null || true
