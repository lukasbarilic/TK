# .github/workflows/claude-ai-agent.yml
#
# AI agent pre tikety TheraSuite (Java/Spring Boot backend + React/TypeScript frontend).
#
#   1. Štítok "ai-agent" na issue -> Claude implementuje zmenu vo vetve ai/...
#   2. "@claude ..." v komentári issue alebo PR -> Claude reaguje na požiadavku.
#
# Predpoklady: GitHub aplikácia Claude, secret CLAUDE_CODE_OAUTH_TOKEN, štítok "ai-agent".

name: AI agent (Claude)

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ai-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'ai-agent') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # --- Backend: Java 25 + Maven ---------------------------------------
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-

      - name: Backend – stiahnutie závislostí
        if: hashFiles('backend/pom.xml') != ''
        working-directory: backend
        run: ./mvnw -B -q dependency:go-offline || true

      # --- Frontend: Node 22 ---------------------------------------------
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend – inštalácia
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm ci

      # --- Agent ---------------------------------------------------------
      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          label_trigger: "ai-agent"
          branch_prefix: "ai/"

          claude_args: >-
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(cd *),Bash(ls *),Bash(mkdir *),Bash(git status),Bash(git diff *),Bash(./mvnw *),Bash(mvn *),Bash(java -version),Bash(npm *),Bash(npx *),Bash(node --version)"
            --append-system-prompt "Pracuješ ako AI vývojár na repozitári TheraSuite (backend Java/Spring Boot v backend/, frontend React+TypeScript v frontend/). Postup: 1) Prečítaj celé issue aj komentáre a CLAUDE.md. 2) Ak issue nemá jasný cieľ alebo akceptačné kritériá, NIČ neimplementuj – napíš do issue konkrétne otázky a skonči. 3) Urob čo najmenšiu zmenu, ktorá splní akceptačné kritériá, a dopíš testy. 4) Spusti build a testy dotknutej časti (backend: ./mvnw -B verify v backend/, frontend: npm run lint, npm test -- --run a npm run build vo frontend/); ak padajú, oprav to. 5) Na záver zhrň po slovensky: čo si zmenil, ako si to overil a čo má človek pri review skontrolovať. Nikdy nemeň .github/workflows, tajomstvá ani produkčnú konfiguráciu."
