[workspace]
members = [".", "crates/vault", "crates/net"]
resolver = "2"

[package]
name = "app"
version = "0.1.0"
edition = "2021"
description = "TheraSuite – desktopová aplikácia"
publish = false

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
therasuite-net = { path = "crates/net" }
therasuite-vault = { path = "crates/vault" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
