server:
  servlet:
    session:
      timeout: ${security.session.idleTimeout}
      cookie:
        http-only: true
        secure: true
        same-site: strict

# Nastavenia zabezpečenia (HLD kap. 9)
security:
  login:
    maxFailedAttempts: 5
    lockDuration: PT15M
  session:
    idleTimeout: PT30M

spring:
  application:
    name: therasuite-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    build:
      enabled: true
    java:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Časové pásmo inštalácie (HLD kap. 9); určuje prvý obchodný deň
organization:
  timezone: Europe/Bratislava

# Konfigurácia desktopového klienta (GET /api/client-config)
app:
  client:
    api-version: 1
    # nesmie byť vyššia ako aktuálna verzia klienta (frontend/package.json), inak sa klient zablokuje
    min-client-version: 0.1.0
    idle-timeout-sec: 1800
    offline:
      plan-days-back: 7
      plan-days-ahead: 60
      sync-interval-sec: 300
      # prázdne = bez obmedzenia veku lokálnych dát
      max-age-days:
