server:
  servlet:
    session:
      timeout: ${security.session.idleTimeout}
      cookie:
        http-only: true
        secure: true
        same-site: strict

# Nastavenia zabezpečenia (HLD kap. 9)
security:
  login:
    maxFailedAttempts: 5
    lockDuration: PT15M
  session:
    idleTimeout: PT30M

spring:
  application:
    name: therasuite-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    build:
      enabled: true
    java:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
